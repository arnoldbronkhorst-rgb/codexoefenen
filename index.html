<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird in JavaScript</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <h1>Flappy Bird</h1>
      <p class="instructions">Druk op <strong>spatie</strong> of klik/tik om te vliegen.</p>
      <canvas id="gameCanvas" width="420" height="640" aria-label="Flappy Bird spel"></canvas>
      <button id="restartBtn" type="button">Opnieuw spelen</button>
    </main>

    <script src="game.js"></script>
  </body>
</html>
